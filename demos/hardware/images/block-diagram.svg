<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1B1A17" stroke-width="1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="398" height="278" rx="8" fill="#F7F4EE" stroke="#1B1A17" stroke-width="1.5"/>

  <!-- Title -->
  <text x="200" y="24" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" fill="#1B1A17">SensorHub Rev 2.1 — System Block Diagram</text>

  <!-- USB-C -->
  <rect x="20" y="60" width="70" height="36" rx="4" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="55" y="82" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#1B1A17">USB-C</text>

  <!-- LiPo Battery -->
  <rect x="20" y="120" width="70" height="36" rx="4" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="55" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#1B1A17">LiPo 3.7V</text>

  <!-- Power Management -->
  <rect x="130" y="80" width="90" height="50" rx="4" fill="#E8F4E8" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="175" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#57544D">TPS63020</text>
  <text x="175" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="500" fill="#1B1A17">Power Mgmt</text>
  <text x="175" y="127" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#57544D">3.3V @ 800mA</text>

  <!-- ESP32-S3 -->
  <rect x="155" y="165" width="110" height="70" rx="6" fill="#E8EEF4" stroke="#1B1A17" stroke-width="1.5"/>
  <text x="210" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#1B1A17">ESP32-S3</text>
  <text x="210" y="204" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#57544D">BLE 5.0 + WiFi</text>
  <text x="210" y="216" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#57544D">I2C / SPI / UART</text>
  <text x="210" y="228" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#57544D">240MHz Dual-Core</text>

  <!-- SHT40 -->
  <rect x="305" y="60" width="75" height="40" rx="4" fill="#FFF4E8" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="342" y="77" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#57544D">SHT40</text>
  <text x="342" y="91" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#1B1A17">Temp/Humidity</text>

  <!-- LIS3DH -->
  <rect x="305" y="115" width="75" height="40" rx="4" fill="#FFF4E8" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="342" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#57544D">LIS3DH</text>
  <text x="342" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#1B1A17">Accelerometer</text>

  <!-- EEPROM -->
  <rect x="305" y="170" width="75" height="40" rx="4" fill="#F4E8F4" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="342" y="187" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#57544D">AT24C256</text>
  <text x="342" y="201" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#1B1A17">EEPROM 32KB</text>

  <!-- BLE Antenna -->
  <rect x="305" y="225" width="75" height="36" rx="4" fill="#E8F4F4" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="342" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#57544D">2.4GHz</text>
  <text x="342" y="254" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#1B1A17">Antenna</text>

  <!-- Connections -->
  <line x1="90" y1="78" x2="130" y2="95" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="90" y1="138" x2="130" y2="115" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="175" y1="130" x2="175" y2="165" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="183" y="150" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">3.3V</text>

  <!-- I2C Bus -->
  <line x1="265" y1="190" x2="305" y2="80" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="265" y1="195" x2="305" y2="135" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="265" y1="200" x2="305" y2="190" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="265" y1="210" x2="305" y2="243" stroke="#1B1A17" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Bus labels -->
  <text x="278" y="100" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">I2C</text>
  <text x="278" y="155" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">I2C</text>
  <text x="278" y="198" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">I2C</text>
  <text x="278" y="236" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">RF</text>
</svg>
