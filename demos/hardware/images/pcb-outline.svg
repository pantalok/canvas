<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <rect x="1" y="1" width="358" height="258" rx="8" fill="#F7F4EE" stroke="#1B1A17" stroke-width="1.5"/>

  <!-- Title -->
  <text x="180" y="20" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" font-weight="600" fill="#1B1A17">PCB Layout — SensorHub Rev 2.1 (32×24mm)</text>

  <!-- Board outline -->
  <rect x="60" y="38" width="240" height="180" rx="4" fill="#FFFFFF" stroke="#1B1A17" stroke-width="1.5"/>

  <!-- Mounting holes -->
  <circle cx="75" cy="53" r="4" fill="none" stroke="#9C988E" stroke-width="1"/>
  <circle cx="285" cy="53" r="4" fill="none" stroke="#9C988E" stroke-width="1"/>
  <circle cx="75" cy="203" r="4" fill="none" stroke="#9C988E" stroke-width="1"/>
  <circle cx="285" cy="203" r="4" fill="none" stroke="#9C988E" stroke-width="1"/>

  <!-- ESP32-S3 Module zone -->
  <rect x="90" y="55" width="100" height="75" rx="3" fill="#E8EEF4" stroke="#1B1A17" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="140" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#1B1A17">U1</text>
  <text x="140" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#57544D">ESP32-S3</text>
  <text x="140" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#9C988E">WROOM-1</text>

  <!-- Antenna keep-out -->
  <rect x="90" y="55" width="100" height="20" rx="2" fill="none" stroke="#B0341A" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="140" y="67" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="5" fill="#B0341A">ANTENNA KEEP-OUT</text>

  <!-- Power section -->
  <rect x="205" y="55" width="80" height="60" rx="3" fill="#E8F4E8" stroke="#1B1A17" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="245" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" font-weight="500" fill="#1B1A17">Power</text>
  <text x="245" y="91" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">U2 MCP73831</text>
  <text x="245" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">U3 TPS63020</text>

  <!-- Sensor section -->
  <rect x="90" y="142" width="80" height="65" rx="3" fill="#FFF4E8" stroke="#1B1A17" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="130" y="162" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" font-weight="500" fill="#1B1A17">Sensors</text>
  <text x="130" y="175" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">U4 SHT40</text>
  <text x="130" y="187" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">U5 LIS3DH</text>
  <text x="130" y="199" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">U6 AT24C256</text>

  <!-- USB-C connector -->
  <rect x="205" y="125" width="80" height="30" rx="3" fill="#F4E8F4" stroke="#1B1A17" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="245" y="144" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" font-weight="500" fill="#1B1A17">J1 USB-C</text>

  <!-- Battery connector -->
  <rect x="205" y="165" width="80" height="42" rx="3" fill="#FCF3CF" stroke="#1B1A17" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="245" y="183" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" font-weight="500" fill="#1B1A17">J2 Battery</text>
  <text x="245" y="196" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6" fill="#57544D">JST-PH 2pin</text>

  <!-- Dimensions -->
  <line x1="60" y1="228" x2="300" y2="228" stroke="#9C988E" stroke-width="0.6"/>
  <line x1="60" y1="225" x2="60" y2="231" stroke="#9C988E" stroke-width="0.6"/>
  <line x1="300" y1="225" x2="300" y2="231" stroke="#9C988E" stroke-width="0.6"/>
  <text x="180" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#9C988E">32.0 mm</text>

  <line x1="310" y1="38" x2="310" y2="218" stroke="#9C988E" stroke-width="0.6"/>
  <line x1="307" y1="38" x2="313" y2="38" stroke="#9C988E" stroke-width="0.6"/>
  <line x1="307" y1="218" x2="313" y2="218" stroke="#9C988E" stroke-width="0.6"/>
  <text x="325" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#9C988E" transform="rotate(90, 325, 132)">24.0 mm</text>

  <!-- Layer info -->
  <text x="180" y="252" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7" fill="#9C988E">4-layer: SIG / GND / PWR / SIG | 1.0mm thickness | ENIG finish</text>
</svg>
